services:
  - type: web
    name: ovi-kreta-tervezo-api
    runtime: node
    # A Supabase kliens natív WebSocketet igényel (Node 22+).
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: BILLING_PROFILE
        value: ev
      - key: STRIPE_SECRET_KEY_EV
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_EV
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY_EV
        sync: false
      - key: SZAMLAZZ_API_KEY_EV
        sync: false
      - key: STRIPE_SECRET_KEY_KFT
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_KFT
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY_KFT
        sync: false
      - key: SZAMLAZZ_API_KEY_KFT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://ovitervezo.hu
      - key: BASE_URL
        value: https://ovitervezo.hu
      - key: NODE_ENV
        value: production
      - key: PAYWALL_ENABLED
        value: "true"
      - key: MAIL_FROM
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SZAMLAZZ_SANDBOX
        value: "true"
      - key: SZAMLAZZ_INVOICE_PREFIX
        sync: false
      - key: COUPON_CODES
        value: TEST100
      - key: BARION_POS_KEY_EV
        sync: false
      - key: BARION_POS_KEY_KFT
        sync: false
      - key: BARION_TEST_MODE
        value: "true"
      - key: BARION_PAYEE_EMAIL
        sync: false
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
