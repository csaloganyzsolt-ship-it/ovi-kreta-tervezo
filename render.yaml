services:
  - type: web
    name: ovi-kreta-tervezo-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SZAMLAZZ_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://ovitervezo.hu
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: BASE_URL
        value: https://ovitervezo.hu
      - key: NODE_ENV
        value: production
      - key: PAYWALL_ENABLED
        value: "true"
      - key: MAIL_FROM
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SZAMLAZZ_SANDBOX
        value: "true"
      - key: SZAMLA_PREFIX
        sync: false
      - key: TEST_DELIVERY_ENABLED
        sync: false
      - key: TEST_DELIVERY_RECIPIENTS
        sync: false
