services:
  - type: web
    name: ovi-kreta-tervezo-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SZAMLAZZ_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://csaloganyzsolt-ship-it.github.io/ovi-kreta-tervezo
      - key: SZAMLAZZ_SANDBOX
        value: "true"
      - key: SZAMLA_PREFIX
        sync: false
